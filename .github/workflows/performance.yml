name: Quality and performance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  performance:
    # Playwright 1.57 ships Chromium/native dependency mappings for Ubuntu 24.04,
    # but none for 26.04. Keep CI reproducible when ubuntu-latest advances.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_REMOTE_BINDINGS: 'false'
      WRANGLER_SEND_METRICS: 'false'
      PERF_OUTPUT: artifacts/performance/ci.json
      PERF_CACHE_OUTPUT: artifacts/performance/cache-headers.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:quality
      - name: Browser smoke
        run: |
          mkdir -p artifacts/quality
          set -o pipefail
          if npm run test:smoke 2>&1 | tee artifacts/quality/browser-smoke.log; then
            exit 0
          else
            # All browser fixtures are synthetic. Surface a bounded failure excerpt
            # in check annotations, which remain visible without full log access.
            python3 - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('artifacts/quality/browser-smoke.log').read_text().splitlines()[-45:])[-5000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Browser smoke failed::' + escaped)
          PY
            exit 1
          fi
      - run: npm run test:performance:ci
      - run: PERF_OUTPUT=artifacts/performance/navigation.json npm run perf:navigation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-and-performance
          path: |
            artifacts/performance/
            artifacts/quality/
            /tmp/mailflare-visual/*.png
            /tmp/mailflare-star-feedback/*.png
            /tmp/mailflare-queue-health/*.png
            /tmp/mailflare-compose-*.png
            /tmp/mailflare-refine-*.png
            /tmp/mailflare-pdf-*.png
            /tmp/mailflare-label-delete-mobile.png
